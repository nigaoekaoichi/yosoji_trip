<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 15px; color: #333; margin-bottom: 140px; }
        h2 { text-align: center; color: #0056b3; margin-top: 10px; }
        
        /* 検索ボックスのエリア */
        .search-container { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .search-box { width: 80%; max-width: 400px; padding: 10px; font-size: 1.1rem; border: 2px solid #0056b3; border-radius: 8px; outline: none; }
        .search-hint { font-size: 0.85rem; color: #666; margin-top: 8px; }

        /* 独立した国旗アイコン選択エリア */
        .global-flags-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .section-title { font-weight: bold; font-size: 1.05em; margin-bottom: 12px; color: #0056b3; }
        .flag-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .flag-btn { font-size: 1.8rem; cursor: pointer; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 6px 12px; transition: transform 0.1s, background-color 0.2s; display: flex; align-items: center; justify-content: center; }
        .flag-btn:active { transform: scale(1.1); background-color: #e9ecef; }

        /* タブのスタイル（従来のフレーズ別タブ） */
        .tab-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #fff; border: 1px solid #0056b3; color: #0056b3; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { background: #0056b3; color: #fff; }

        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .phrase-title { font-weight: bold; font-size: 1.1em; margin-bottom: 10px; color: #333; border-left: 4px solid #0056b3; padding-left: 8px; }
        
        #display-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: white; padding: 20px; text-align: center; border-radius: 15px 15px 0 0; box-shadow: 0 -3px 10px rgba(0,0,0,0.2); z-index: 1000; }
        #text-sub { font-size: 1rem; color: #ffca28; margin-bottom: 8px; font-weight: bold; min-height: 1.2em; white-space: pre-line; }
        #text-main { font-size: 1.4em; font-weight: bold; margin: 0; white-space: pre-line; word-break: break-word; }
    </style>

    <!-- プログラム部分 -->
    <script>
        // Mac/iOSの音声対策
        window.addEventListener('DOMContentLoaded', () => {
            window.speechSynthesis.cancel();
            let wakeUp = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(wakeUp);
        });

        // タブでカテゴリーを切り替える関数
        function filterCategory(category, btnElement) {
            let buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            let cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // 従来のフレーズ別ボタンを押したとき
        function speak(word, furigana, langCode) {
            document.getElementById('text-sub').innerText = furigana;
            document.getElementById('text-main').innerText = word;

            playSpeech(word, langCode);
        }

        // 検索窓の下にある「国旗アイコン」を押したとき
        function speakGlobal(langCode) {
            let userInput = document.getElementById('customInput').value.trim();
            
            if (userInput === "") {
                document.getElementById('text-sub').innerText = "検索窓に言葉を入れてね";
                document.getElementById('text-main').innerText = "⚠️ 言葉が未入力です";
                return;
            }

            // 入力された日本語をそのまま音声合成に渡す（または翻訳風に喋らせる）
            document.getElementById('text-sub').innerText = "自由入力の音声再生";
            document.getElementById('text-main').innerText = userInput;

            playSpeech(userInput, langCode);
        }

        // 共通の音声再生エンジン（Macバグ対策込み）
        function playSpeech(text, langCode) {
            window.speechSynthesis.cancel();
            
            setTimeout(() => {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCode;
                utterance.rate = 0.85;

                if (window.speechSynthesis.getVoices().length === 0) {
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.speak(utterance);
                    };
                } else {
                    window.speechSynthesis.speak(utterance);
                }
            }, 50);
        }
    </script>
