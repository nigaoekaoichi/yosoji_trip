    <!-- タップしたときに声を出すための大事なプログラム -->
    <script>
        function speak(word, furigana, langCode) {
            // 1. 画面のふりがなと現地の文字を書き換える
            document.getElementById('text-sub').innerText = furigana;
            document.getElementById('text-main').innerText = word;

            // 2. 音声再生の処理
            // 連打された時のために、今しゃべっている音声を一旦ストップする
            window.speechSynthesis.cancel();
            
            // しゃべる内容と言語を設定する
            let utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = langCode;
            utterance.rate = 0.85; // 聞き取りやすいように少しだけゆっくりに設定

            // 実際にスマホにしゃべらせる
            window.speechSynthesis.speak(utterance);
        }
    </script>
