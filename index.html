<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦫もちもち旅行フレーズ集✈️</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 15px; color: #333; margin-bottom: 140px; }
        h2 { text-align: center; color: #0056b3; margin-top: 10px; }
        
        /* 検索ボックスとボタンのエリア */
        .search-container { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .search-box { width: 100%; max-width: 280px; padding: 10px; font-size: 1.1rem; border: 2px solid #0056b3; border-radius: 8px; outline: none; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }
        
        .btn-group { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
        .action-btn { padding: 10px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .search-btn { background: #0056b3; color: white; }
        .search-btn:hover { background: #004085; }
        .clear-btn { background: #6c757d; color: white; }
        .clear-btn:hover { background: #5a6268; }
        .search-hint { font-size: 0.85rem; color: #666; margin-top: 10px; }

        /* タブのスタイル */
        .tab-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #fff; border: 1px solid #0056b3; color: #0056b3; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { background: #0056b3; color: #fff; }

        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .phrase-title { font-weight: bold; font-size: 1.1em; margin-bottom: 10px; color: #333; border-left: 4px solid #0056b3; padding-left: 8px; }
        .flag-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .flag-btn { font-size: 1.8rem; cursor: pointer; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 6px 12px; transition: transform 0.1s, background-color 0.2s; display: flex; align-items: center; justify-content: center; }
        .flag-btn:active { transform: scale(1.1); background-color: #e9ecef; }
        
        #display-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: white; padding: 20px; text-align: center; border-radius: 15px 15px 0 0; box-shadow: 0 -3px 10px rgba(0,0,0,0.2); z-index: 1000; }
        #text-sub { font-size: 1rem; color: #ffca28; margin-bottom: 8px; font-weight: bold; min-height: 1.2em; white-space: pre-line; }
        #text-main { font-size: 1.4em; font-weight: bold; margin: 0; white-space: pre-line; word-break: break-word; }
    </style>
</head>
<body>

    <h2>🦫 もちもち旅行フレーズ集 ✈️</h2>

    <!-- 🔍 検索＆クリアボタンエリア -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="日本語を入力（例: ありがとう）">
        <div class="btn-group">
            <button class="action-btn search-btn" onclick="generateSearchCard()">検索</button>
            <button class="action-btn clear-btn" onclick="clearSearchCard()">クリア</button>
        </div>
        <div class="search-hint">💡 部分一致に対応！キーワードの一部でも検索できます。</div>
    </div>

    <!-- 🔍 検索結果が表示される専用エリア -->
    <div id="dynamicSearchResult"></div>

    <!-- カテゴリー切り替えタブ -->
    <div class="tab-container">
        <button class="tab-btn active" onclick="filterCategory('all', this)">すべて</button>
        <button class="tab-btn" onclick="filterCategory('greeting', this)">挨拶</button>
        <button class="tab-btn" onclick="filterCategory('profile', this)">自己紹介</button>
        <button class="tab-btn" onclick="filterCategory('food', this)">食事</button>
    </div>

    <!-- 一覧カード描画エリア -->
    <div id="defaultCardsContainer"></div>

    <!-- 画面下部に固定される結果表示パネル -->
    <div id="display-panel">
        <div id="text-sub">国旗をタップしてね</div>
        <p id="text-main">---</p>
    </div>

    <!-- プログラム部分 -->
    <script>

            { id: 3, cat: "greeting", jp: "さようなら", data: { "en-US": ["Goodbye", "グッドバイ"], "es-ES": ["Adiós", "アディオス"], "it-IT": ["Arrivederci", "アッリヴェデルチ"], "fr-FR": ["Au revoir", "オ ルヴォワール"], "de-DE": ["Auf Wiedersehen", "アウフ ヴィーダーゼーエン"], "pt-PT": ["Tchau", "チャウ"], "tr-TR": ["Hoşça kal", "ホシュチャ カル"], "ko-KR": ["안녕히 가세요", "アンニョンヒ カセヨ"], "zh-CN": ["再见", "ザイ ジエン"], "hi-IN": ["अलविदा", "アルヴィダー"], "th-TH": ["ลา, ก่อน", "ラーゴーン"], "sv-SE": ["Hej då", "ヘイ ドー"], "hr-HR": ["Doviđenja", "ドヴィジェニャ"], "no-NO": ["Ha det bra", "ハー デ ブラ"], "fi-FI": ["Näkemiin", "ナケミーン"] } },
            { id: 4, cat: "greeting", jp: "YES", data: { "en-US": ["Yes", "イエス"], "es-ES": ["Sí", "スィー"], "it-IT": ["Sì", "スィー"], "fr-FR": ["Oui", "ウィ"], "de-DE": ["Ja", "ヤー"], "pt-PT": ["Sim", "シン"], "tr-TR": ["Evet", "エヴェット"], "ko-KR": ["네", "ネ"], "zh-CN": ["是", "シー"], "hi-IN": ["हाँ", "ハーン"], "th-TH": ["ใช่", "チャイ"], "sv-SE": ["Ja", "ヤー"], "hr-HR": ["Da", "ダ"], "no-NO": ["Ja", "ヤー"], "fi-FI": ["Kyllä", "キュッラ"] } },
            { id: 5, cat: "greeting", jp: "NO", data: { "en-US": ["No", "ノー"], "es-ES": ["No", "ノ"], "it-IT": ["No", "ノ"], "fr-FR": ["Non", "ノン"], "de-DE": ["Nein", "ナイン"], "pt-PT": ["Não", "ナウン"], "tr-TR": ["Hayır", "ハユル"], "ko-KR": ["아니요", "アニヨ"], "zh-CN": ["不", "ブー"], "hi-IN": ["नहीं", "ナヒーン"], "th-TH": ["ไม่ใช่", "マイ チャイ"], "sv-SE": ["Nej", "ネイ"], "hr-HR": ["Ne", "ネ"], "no-NO": ["Nei", "ネイ"], "fi-FI": ["Ei", "エイ"] } },
            { id: 6, cat: "greeting", jp: "こんにちわ", data: { "en-US": ["Hello", "ハロー"], "es-ES": ["Hola", "オラ"], "it-IT": ["Buongiorno", "ブオンジョルノ"], "fr-FR": ["Bonjour", "ボンジュール"], "de-DE": ["Guten Tag", "グーテン ターク"], "pt-PT": ["Olá", "オラ"], "tr-TR": ["Merhaba", "メルハバ"], "ko-KR": ["안녕하세요", "アンニョンハセヨ"], "zh-CN": ["你好", "ニーハオ"], "hi-IN": ["नमस्ते", "ナマステ"], "th-TH": ["สวัสดี", "サワッディー"], "sv-SE": ["Hej", "ヘイ"], "hr-HR": ["Dobar dan", "ドバル ダン"], "no-NO": ["Hallo", "ハロー"], "fi-FI": ["Hei", "ヘイ"] } },
            { id: 7, cat: "profile", jp: "私は日本から来ました", data: { "en-US": ["I'm from Japan", "アイム フロム ジャパン"], "es-ES": ["Soy de Japón", "ソイ デ ハポン"], "it-IT": ["Vengo dal Giappone", "ヴェンゴ ダル ジャッポーネ"], "fr-FR": ["Je viens du Japon", "ジュ ヴィアン デュ ジャポン"], "de-DE": ["Ich komme aus Japan", "イッヒ コメ アウス ヤーパン"], "pt-PT": ["Sou do Japão", "ソウ ドゥ ジャパォン"], "tr-TR": ["Japonya'dan geliyorum", "ジャポンヤダン ゲリヨルム"], "ko-KR": ["저는 일본에서 왔어요", "チョヌン イルボネソ ワッソヨ"], "zh-CN": ["我来自日本", "ウォー ライズー リーベン"], "hi-IN": ["मैं जापान से हूँ", "मैं जापान से हूँ"], "th-TH": ["มาจากญี่ปุ่น", "マー ジャーク イープン"], "sv-SE": ["Jag kommer från Japan", "コンメル フロン ヤーパン"], "hr-HR": ["Dolazim iz Japana", "ドラジム イズ ジャパナ"], "no-NO": ["Jeg kommer fra Japan", "コンメル フラ ヤーパン"], "fi-FI": ["Olen kotoisin Japanista", "オレン コトイシン"] } },

            { id: 9, cat: "profile", jp: "私の名前はヒトミです", data: { "en-US": ["My name is Hitomi", "マイ ネーム イズ ヒトミ"], "es-ES": ["Me llamo Hitomi", "メ リャモ ヒトミ"], "it-IT": ["Mi chiamo Hitomi", "ミ キアーモ ヒトミ"], "fr-FR": ["Je m appelle Hitomi", "ジュ マペル ヒトミ"], "de-DE": ["Ich heiße Hitomi", "イッヒ ハイセ ヒトミ"], "pt-PT": ["Chamo me Hitomi", "シャモ メ ヒトミ"], "tr-TR": ["Benim adım Hitomi", "ベニム アドゥム ヒトミ"], "ko-KR": ["제 이름은 히토미입니다", "チェ イロムン ヒトミイムニダ"], "zh-CN": ["我叫Hitomi", "ウォー ジァオ ヒトミ"], "hi-IN": ["मेरा नाम हितomi है", "メーラー ナーム ヒトミ"], "th-TH": ["ดิฉันชื่อฮิโตมิ", "ディチャン チュー ヒトミ"], "sv-SE": ["Jag heter Hitomi", "ヤーグ ヘーテル ヒトミ"], "hr-HR": ["Zovem se Hitomi", "ゾヴェム セ ヒトミ"], "no-NO": ["Jeg heter Hitomi", "イェイ ヘーテル ヒトミ"], "fi-FI": ["Nimeni on Hitomi", "ニメニ オン ヒトミ"] } },
            { id: 10, cat: "food", jp: "美味しいです", data: { "en-US": ["It is delicious", "イット イズ ディリシャス"], "es-ES": ["Está muy rico", "エスタ ムイ リコ"], "it-IT": ["È delizioso", "エ デリツィオーゾ"], "fr-FR": ["C est delicieux", "セ デリシユー"], "de-DE": ["Es ist lecker", "エス イスト レッカー"], "pt-PT": ["Está delicioso", "エスタ デリシオゾ"], "tr-TR": ["Çok lezzetli", "チョク レッツェッティ"], "ko-KR": ["맛있어요", "マシッソヨ"], "zh-CN": ["很好吃", "ヘン ハオ チー"], "hi-IN": ["यह स्वादिष्ट है", "यह स्वादिष्ट है"], "th-TH": ["อร่อยมาก", "アロイ マーク"], "sv-SE": ["Det är gott", "デ アー ゴット"], "hr-HR": ["Ukusno je", "ウクスノ イェ"], "no-NO": ["Det er godt", "デ エア ゴット"], "fi-FI": ["Hyvää", "ヒュヴァー"] } }
        ];

        // Mac/iOSの音声対策
        window.addEventListener('DOMContentLoaded', () => {
            window.speechSynthesis.cancel();
            let wakeUp = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(wakeUp);
            renderDefaultCards('all');
        });

        // デフォルトカードを描画する関数
        function renderDefaultCards(category) {
            let container = document.getElementById('defaultCardsContainer');
            container.innerHTML = "";

            phraseDatabase.forEach(item => {
                if (category === 'all' || item.cat === category) {
                    let cardHtml = `
                        <div class="card" data-category="${item.cat}">
                            <div class="phrase-title">${item.id}. ${item.jp}</div>
                            <div class="flag-container">
                                <button class="flag-btn" title="英語" onclick="speak('${item.data['en-US'][0]}', '${item.data['en-US'][1]}', 'en-US')">🇺🇸</button>
                                <button class="flag-btn" title="スペイン語" onclick="speak('${item.data['es-ES'][0]}', '${item.data['es-ES'][1]}', 'es-ES')">🇪🇸</button>
                                <button class="flag-btn" title="イタリア語" onclick="speak('${item.data['it-IT'][0]}', '${item.data['it-IT'][1]}', 'it-IT')">🇮🇹</button>
                                <button class="flag-btn" title="フランス語" onclick="speak('${item.data['fr-FR'][0]}', '${item.data['fr-FR'][1]}', 'fr-FR')">🇫🇷</button>
                                <button class="flag-btn" title="ドイツ語" onclick="speak('${item.data['de-DE'][0]}', '${item.data['de-DE'][1]}', 'de-DE')">🇩🇪</button>
                                <button class="flag-btn" title="ポルトガル語" onclick="speak('${item.data['pt-PT'][0]}', '${item.data['pt-PT'][1]}', 'pt-PT')">🇵🇹</button>
                                <button class="flag-btn" title="トルコ語" onclick="speak('${item.data['tr-TR'][0]}', '${item.data['tr-TR'][1]}', 'tr-TR')">🇹🇷</button>
                                <button class="flag-btn" title="韓国語" onclick="speak('${item.data['ko-KR'][0]}', '${item.data['ko-KR'][1]}', 'ko-KR')">🇰🇷</button>
                                <button class="flag-btn" title="中国語" onclick="speak('${item.data['zh-CN'][0]}', '${item.data['zh-CN'][1]}', 'zh-CN')">🇨🇳</button>
                                <button class="flag-btn" title="ヒンドゥー語" onclick="speak('${item.data['hi-IN'][0]}', '${item.data['hi-IN'][1]}', 'hi-IN')">🇮🇳</button>
                                <button class="flag-btn" title="タイ語" onclick="speak('${item.data['th-TH'][0]}', '${item.data['th-TH'][1]}', 'th-TH')">🇹🇭</button>
                                <button class="flag-btn" title="スウェーデン語" onclick="speak('${item.data['sv-SE'][0]}', '${item.data['sv-SE'][1]}', 'sv-SE')">🇸🇪</button>
                                <button class="flag-btn" title="クロアチア語" onclick="speak('${item.data['hr-HR'][0]}', '${item.data['hr-HR'][1]}', 'hr-HR')">🇭🇷</button>
                                <button class="flag-btn" title="ノルウェー語" onclick="speak('${item.data['no-NO'][0]}', '${item.data['no-NO'][1]}', 'no-NO')">🇳🇴</button>
                                <button class="flag-btn" title="フィンランド語" onclick="speak('${item.data['fi-FI'][0]}', '${item.data['fi-FI'][1]}', 'fi-FI')">🇫🇮</button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                }
            });
        }

        // タブでカテゴリーを切り替える関数
        function filterCategory(category, btnElement) {
            let buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            document.getElementById('searchInput').value = "";
            document.getElementById('dynamicSearchResult').innerHTML = "";
            renderDefaultCards(category);
        }

        // 音声再生＆カナ表記表示関数
        function speak(word, furigana, langCode) {
            document.getElementById('text-sub').innerText = furigana;
            document.getElementById('text-main').innerText = word;

            window.speechSynthesis.cancel();
            
            setTimeout(() => {
                let utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = langCode;
                utterance.rate = 0.85;

                if (window.speechSynthesis.getVoices().length === 0) {
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.speak(utterance);
                    };
                } else {
                    window.speechSynthesis.speak(utterance);
                }
            }, 50);
        }

        // 🔍 検索ボタンを押したときの処理（部分一致対応）
        function generateSearchCard() {
            let query = document.getElementById('searchInput').value.trim();
            if (query === "") {
                alert("言葉を入力してください");
                return;
            }

            let container = document.getElementById('dynamicSearchResult');
            
            // ロード画面
            container.innerHTML = `
                <div class="card" style="text-align: center; padding: 20px; color: #0056b3; font-weight: bold;">
                    ⏳ 「${query}」を部分一致で検索中...
                </div>
            `;

            setTimeout(() => {
                let matchedItems = phraseDatabase.filter(item => item.jp.includes(query));

                if (matchedItems.length === 0) {
                    container.innerHTML = `
                        <div class="card" style="text-align: center; padding: 20px; color: #d9534f; font-weight: bold; background-color: #fffdfd; border: 2px solid #d9534f;">
                            ⚠️ 「${query}」に一致するフレーズは見つかりませんでした。<br>
                            <span style="font-size: 0.85rem; color: #666; font-weight: normal; margin-top: 5px; display: inline-block;">（「ありがとう」「はじめまして」「美味しい」などで検索してみてください）</span>
                        </div>
                    `;
                    return;
                }

                let resultsHtml = "";
                matchedItems.forEach(foundItem => {
                    resultsHtml += `
                        <div class="card" style="border: 2px solid #0056b3; background-color: #f8fbff;">
                            <div class="phrase-title">🔍 検索結果: ${foundItem.jp}</div>
                            <div class="flag-container">
                                <button class="flag-btn" title="英語" onclick="speak('${foundItem.data['en-US'][0]}', '${foundItem.data['en-US'][1]}', 'en-US')">🇺🇸</button>
                                <button class="flag-btn" title="スペイン語" onclick="speak('${foundItem.data['es-ES'][0]}', '${foundItem.data['es-ES'][1]}', 'es-ES')">🇪🇸</button>
                                <button class="flag-btn" title="イタリア語" onclick="speak('${foundItem.data['it-IT'][0]}', '${foundItem.data['it-IT'][1]}', 'it-IT')">🇮🇹</button>
                                <button class="flag-btn" title="フランス語" onclick="speak('${foundItem.data['fr-FR'][0]}', '${foundItem.data['fr-FR'][1]}', 'fr-FR')">🇫🇷</button>
                                <button class="flag-btn" title="ドイツ語" onclick="speak('${foundItem.data['de-DE'][0]}', '${foundItem.data['de-DE'][1]}', 'de-DE')">🇩🇪</button>
                                <button class="flag-btn" title="ポルトガル語" onclick="speak('${foundItem.data['pt-PT'][0]}', '${foundItem.data['pt-PT'][1]}', 'pt-PT')">🇵🇹</button>
                                <button class="flag-btn" title="トルコ語" onclick="speak('${foundItem.data['tr-TR'][0]}', '${foundItem.data['tr-TR'][1]}', 'tr-TR')">🇹🇷</button>
                                <button class="flag-btn" title="韓国語" onclick="speak('${foundItem.data['ko-KR'][0]}', '${foundItem.data['ko-KR'][1]}', 'ko-KR')">🇰🇷</button>
                                <button class="flag-btn" title="中国語" onclick="speak('${foundItem.data['zh-CN'][0]}', '${foundItem.data['zh-CN'][1]}', 'zh-CN')">🇨🇳</button>

                        </div>
                    `;
                });

                container.innerHTML = resultsHtml;
            }, 800);
        }

        // 🧹 クリアボタン
        function clearSearchCard() {
